[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.35"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
# Tests may read the committed ABI file and nothing else.
fs_permissions = [{ access = "read", path = "./abi" }]

[fmt]
line_length = 100

# Polygon Amoy testnet, chain id 80002. The URL comes from the environment and is never committed.
[rpc_endpoints]
amoy = "${AMOY_RPC_URL}"
