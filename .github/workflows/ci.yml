name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.7

      - name: Testnet-only and secret guard
        run: bash scripts/check-testnet-only.sh

      - name: Guard self-test
        run: bash scripts/check-testnet-only.test.sh

      - name: Wallet scripts self-test
        run: bash scripts/wallets/wallets.test.sh

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: ABI drift check
        run: bash scripts/check-abi.sh

      - name: Test
        run: forge test -vvv
