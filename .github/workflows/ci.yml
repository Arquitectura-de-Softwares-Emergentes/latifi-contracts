name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.7

      - name: Testnet-only and secret guard
        run: bash scripts/check-testnet-only.sh

      - name: Guard self-test
        run: bash scripts/check-testnet-only.test.sh

      - name: Wallet scripts self-test
        run: bash scripts/wallets/wallets.test.sh

      - name: Dependency pin guard
        run: bash scripts/check-deps-pinned.sh

      - name: Repo lint self-test
        run: bash scripts/check-lint.test.sh

      - name: Repo lint rules
        run: bash scripts/check-lint.sh

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: forge lint
        run: forge lint --severity high med --deny warnings

      - name: ABI drift check
        run: bash scripts/check-abi.sh

      - name: Deploy script dry run
        run: forge script script/Deploy.s.sol:Deploy --sender 0x5577fc66c64e4749eed2e09E6Cd5A2b0e7F970D6

      - name: Test (ci profile)
        run: forge test --profile ci -vvv

      - name: Coverage self-test
        run: bash scripts/check-coverage.test.sh

      - name: Coverage
        run: |
          forge coverage --report summary --report lcov --report-file lcov.info --no-match-coverage "(test|script)/"
          bash scripts/check-coverage.sh lcov.info 90 src/
